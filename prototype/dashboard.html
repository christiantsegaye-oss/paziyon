<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="robots" content="noindex">
  <title>P.A.Z.I.Y.O.N Caregiver View</title>
  <link rel="icon" type="image/png" href="img/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Noto+Sans+Ethiopic:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
  <style>
    .dash { max-width: 720px; margin: 0 auto; padding: calc(16px + env(safe-area-inset-top, 0px)) 16px calc(16px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 12px; }
    .banner { border-radius: var(--radius-md); padding: 16px; color: #fff; font: 700 22px/1.3 var(--font); }
    .banner--active { background: var(--red-600); }
    .banner--resolved { background: var(--green-700); }
    .banner small { display: block; font: 400 16px var(--font); opacity: 0.95; margin-top: 4px; }
    .map { width: 100%; aspect-ratio: 4 / 3; border: 1px solid var(--border); border-radius: var(--radius-md); }
    .note { font-size: 0.85rem; }
  </style>
</head>
<body>
  <div class="dash">
    <div id="content"></div>
    <p class="muted note">
      Demo build: this page shows the alert as it was when the SMS was sent. The production version reads a live alert record, so the location keeps updating.
    </p>
  </div>
  <script type="module" src="js/dashboard.js"></script>
</body>
</html>
